name: Keep Streamlit Alive

on:
  schedule:
    - cron: "17 */4 * * *"   # every 4 hours (minute 17 avoids the busy top of the hour)
  workflow_dispatch: {}      # manual run from the Actions tab

permissions:
  contents: read             # no more empty commits, so no write access needed

concurrency:
  group: keep-streamlit-awake
  cancel-in-progress: true

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install Playwright + Chromium
        run: pip install playwright && playwright install --with-deps chromium
      - name: Open the app in a headless browser (wake it if asleep)
        run: python keep_alive.py
      - name: Upload screenshot
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: app-screenshot
          path: screenshot.png
          retention-days: 7
