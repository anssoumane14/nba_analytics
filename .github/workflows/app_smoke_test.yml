name: App smoke test

on:
  push:
    branches-ignore: [main]   # test branches before they are merged
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Installed versions
        run: pip freeze | grep -iE '^(pandas|streamlit|plotly|requests|beautifulsoup4|numpy|openpyxl|lxml|html5lib)==' | while read l; do echo "::notice::$l"; done
      - name: Run Home and every page with AppTest
        run: python tests/smoke_test.py
